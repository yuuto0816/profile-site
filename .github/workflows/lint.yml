name: Lint Check

# mainブランチへのプッシュ、およびPR作成時に実行する
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    # 実行環境は最新のUbuntuを使用
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト
      - uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ（バージョンは手元の環境に合わせる）
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 依存関係のインストール（npm ci はCI環境に適した高速インストール）
      - name: Install dependencies
        run: npm ci

      # 4. Lintチェックの実行
      - name: Run lint
        run: npm run lint